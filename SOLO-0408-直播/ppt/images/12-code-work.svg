  <g font-family="Inter, 'Noto Sans SC', sans-serif" fill="#111820">
    <text x="144" y="132" font-size="46" font-weight="800">More Than Coding</text>
    <text x="144" y="186" font-size="25" opacity=".62">从写代码扩展到研发链路与通用工作流。</text>
    <text x="214" y="282" font-size="21" font-family="'IBM Plex Mono', monospace" opacity=".52">CODE MODE</text>
    <text x="214" y="324" font-size="34" font-weight="800">编程场景</text>
    <text x="214" y="626" font-size="22" opacity=".62">需求、代码、测试、发布、运维</text>
    <text x="980" y="282" font-size="21" font-family="'IBM Plex Mono', monospace" opacity=".52">WORK MODE</text>
    <text x="980" y="324" font-size="34" font-weight="800">泛化工作</text>
    <text x="980" y="626" font-size="22" opacity=".62">调研、文档、会议纪要、知识库</text>
    <text x="704" y="372" font-size="22" font-family="'IBM Plex Mono', monospace" opacity=".55">PC + WEB</text>
    <text x="524" y="806" font-size="23" font-family="'IBM Plex Mono', monospace" opacity=".55">VERTICAL CHAIN + HORIZONTAL SCENES</text>
  </g>
</svg>
