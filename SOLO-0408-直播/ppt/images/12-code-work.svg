<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SOLO Code 与 Work 模式</title>
  <desc id="desc">SOLO 从编程场景扩展到通用工作场景，同时支持 PC 与 Web 的双模式示意图。</desc>
  <rect width="1600" height="900" fill="#f7f5f2"/>
  <g fill="none" stroke="#111820" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="142" y="206" width="550" height="470" rx="30" fill="#fff"/>
    <rect x="908" y="206" width="550" height="470" rx="30" fill="#fff"/>
    <path d="M420 676v92M1180 676v92M344 768h154M1104 768h154" opacity=".45"/>
    <path d="M230 330h356M230 388h270M230 446h310" opacity=".45"/>
    <path d="M996 330h356M996 388h280M996 446h224" opacity=".45"/>
    <path d="M340 536h150M1036 538h260" stroke="#4a6cf7" stroke-width="7"/>
    <path d="M778 436h142" stroke="#4a6cf7" stroke-width="7"/>
    <path d="M884 396l52 40-52 40" stroke="#4a6cf7" stroke-width="7"/>
    <circle cx="417" cy="536" r="72" fill="#eef2ff"/>
    <path d="M398 512h52M398 544h40"/>
    <circle cx="1116" cy="536" r="54" fill="#eef2ff"/>
    <path d="M1102 520h36M1102 552h26"/>
